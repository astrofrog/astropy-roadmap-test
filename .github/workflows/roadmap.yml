# Records the roadmap from GitHub in roadmap.yaml.
#
# Weekly or on demand: read the objectives and key results from the issues on
# the project board, write them to roadmap.yaml, and open or update a pull
# request with the changes for the SPOC to merge. The web page is built by Read
# the Docs from roadmap.yaml, so nothing generated is committed.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be enabled. The default token cannot read project boards, so
# the pull step uses the ROADMAP_TOKEN secret: a classic personal access token
# with the read:project scope, or for a board owned by an organization a GitHub
# App token with read access to the organization's projects.
name: Roadmap

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruamel.yaml jinja2
      - run: python roadmap.py pull https://github.com/users/astrofrog/projects/5 roadmap.yaml | tee changes.md
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: roadmap-snapshot
          add-paths: roadmap.yaml
          commit-message: Record the roadmap from GitHub
          title: Record the roadmap from GitHub
          body-path: changes.md
          delete-branch: true
