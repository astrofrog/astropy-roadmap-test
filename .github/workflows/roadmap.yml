# Keeps the roadmap issues in step with roadmap.yaml.
#
# On a pull request: validate the YAML files. On a push to main, weekly, or on
# demand: create or update the issues from the YAML. The web page is built by
# Read the Docs from the YAML directly, so nothing generated is committed.
name: Roadmap

on:
  pull_request:
    paths: [roadmap.yaml, text.yaml, roadmap.py]
  push:
    branches: [main]
    paths: [roadmap.yaml, text.yaml, roadmap.py]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml jinja2
      - run: python roadmap.py validate roadmap.yaml

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml jinja2
      # Replace the site URL with the Read the Docs address once the project exists.
      - run: python roadmap.py sync roadmap.yaml --repo ${{ github.repository }} --site https://astropy-roadmap.readthedocs.io/en/latest/ --yes
