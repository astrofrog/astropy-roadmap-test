# Keeps the roadmap issues in step with roadmap.yaml, and records status back.
#
# On a pull request: validate the YAML files. On a push to main, weekly, or on
# demand: create or update the issues from the YAML, cache issue numbers,
# completion dates and the project board's ranking in status.yaml, and open or update a pull request with the result for
# the SPOC to merge. The web page is built by Read the Docs
# from the YAML, so nothing generated is committed.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be enabled. Pull requests opened with the default token do
# not trigger the validate job; use a GitHub App token to change that.
#
# The default token cannot read project boards, so the pull step uses the
# ROADMAP_TOKEN secret: a classic personal access token with the repo and
# read:project scopes, or for a board owned by an organization a GitHub App
# token with read access to the organization's projects. New objective issues
# reach the board through its built-in auto-add workflow, filtered on
# is:issue label:objective.
name: Roadmap

on:
  pull_request:
    paths: [roadmap.yaml, text.yaml, roadmap.py]
  push:
    branches: [main]
    paths: [roadmap.yaml, text.yaml, roadmap.py]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruamel.yaml jinja2
      - run: python roadmap.py validate roadmap.yaml

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruamel.yaml jinja2
      - run: python roadmap.py sync roadmap.yaml --repo ${{ github.repository }} --site https://astropy-roadmap-testing.readthedocs.io/en/latest/ --yes
      - run: python roadmap.py pull roadmap.yaml --repo ${{ github.repository }} --project https://github.com/users/astrofrog/projects/5 | tee changes.md
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: roadmap-status
          add-paths: status.yaml
          commit-message: Record roadmap status from GitHub issues
          title: Record roadmap status from GitHub issues
          body-path: changes.md
          delete-branch: true
