# The wording of the published roadmap page. The objectives and key results themselves
# are GitHub issues; roadmap.yaml is a snapshot of them written by roadmap.py pull.
title: The Astropy Roadmap
revision: October 2026 (draft, proof of concept)

sections:
- title: Introduction
  text: |
    This Roadmap captures the high level objectives that the Astropy Project aims to achieve to improve the health and stability of the Project, together with the key results we will use to measure progress towards each objective. It is maintained by the Strategic Planning and Organizing Committee (SPOC) and is revisited at least once a year at the Astropy coordination meeting, and at any time via pull requests to this repository.

    The Roadmap is used to prioritize the allocation of Project resources. In particular, funding requests submitted in response to the Project's funding calls are asked to identify which key results they address.
- title: How to read this document
  text: |
    Each **objective** is a qualitative goal that describes a state we want the Project to reach. Each objective has up to five **key results**: concrete, measurable outcomes that, taken together, tell us whether the objective has been achieved. A key result is a single sentence that contains its own measure of success, for example a number, a published document, or a merged and released feature.

    Every objective has an identifier such as `O3` and every key result has an identifier such as `KR3.2`. Identifiers are stable: once assigned they are never renumbered or reused, so they can be cited in funding requests, issues, and pull requests without ambiguity. New objectives and key results take the next unused number.

    The objectives and key results are GitHub issues in the roadmap repository, maintained by the SPOC: one issue per objective, with the `objective` label, linked from the line under its heading, and one sub-issue of it per key result, with the `key result` label, linked from the end of the key result. Each issue title starts with its identifier. This document is generated from those issues. Status updates, links to funded work, and links to implementation pull requests belong in the issues. A key result is complete when its issue has been closed as completed, and an objective is complete when the SPOC closes its issue as completed, after which it is listed under completed objectives below. An entry that no longer applies is closed as not planned; it stays in this document, marked as not planned, as a record, and its identifier is not reused.

    Open objectives are ranked by the SPOC, with rank 1 the highest priority, and are listed in rank order. The rank reflects how important the SPOC considers it that progress is made before the next revision, independent of whether anyone is currently working on it. The SPOC sets it by ordering the objective issues on the roadmap's GitHub project board; objectives not on the board are listed after the ranked ones as unranked.

footer: Objectives and key results are maintained by the Astropy Strategic Planning and Organizing Committee.
